# Render Blueprint — deploys the Glamira API + a PostgreSQL database.
# Docs: https://render.com/docs/blueprint-spec
#
# To deploy: push this file to GitHub, then in the Render dashboard choose
# "New +" → "Blueprint" and point it at this repo. Render reads this file and
# provisions both the web service and the database.

databases:
  - name: glamira-db
    plan: free            # free Postgres (note: expires ~90 days after creation)
    databaseName: glamira
    user: glamira
    region: singapore

services:
  - type: web
    name: glamira-api
    runtime: python
    plan: free            # free web service (spins down after ~15 min idle)
    region: singapore     # must match the database region for the internal URL
    branch: master
    buildCommand: pip install -r requirements.txt
    # Free tier has no pre-deploy hook, so run migrations before booting the
    # server. `alembic upgrade head` is a no-op when the DB is already current.
    startCommand: alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.13.4"

      # Injected from the database above (postgresql://...). config.py rewrites
      # it to the +asyncpg driver at load time.
      - key: DATABASE_URL
        fromDatabase:
          name: glamira-db
          property: connectionString

      # A strong JWT secret is generated once and kept across deploys.
      - key: SECRET_KEY
        generateValue: true

      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "10080"    # 7 days

      # Lock this down to your real frontend origin(s) once you have them.
      - key: CORS_ORIGINS
        value: "*"

      # Optional — set these in the Render dashboard when you need them.
      # sync: false keeps them out of source control and prompts on first deploy.
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_FROM
        value: no-reply@glamira.app
